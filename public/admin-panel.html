<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Panel</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
body {
  min-height: 100vh;
  background: #0d0f18;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.box {
  max-width: 420px;
  width: 100%;
  background: #171a25;
  border: 1px solid #292c3b;
  border-radius: 24px;
  padding: 30px 26px;
  text-align: center;
  box-shadow: 0 25px 60px rgba(0,0,0,0.6);
}
h1 { font-size: 22px; margin-bottom: 6px; }
h2 { font-size: 15px; color: #8d91a2; margin-bottom: 14px; text-align: left; }
.sub { color: #8d91a2; font-size: 13px; margin-bottom: 24px; }
label {
  display: block; text-align: left;
  color: #858a9c; font-size: 12px; font-weight: 600;
  margin-bottom: 6px;
}
input {
  width: 100%; height: 50px; padding: 0 14px;
  background: #1b1e2a; border: 1px solid #303444;
  border-radius: 12px; color: #fff; font-size: 14px;
  margin-bottom: 14px; outline: none;
  transition: .15s;
}
input:focus { border-color: #8b5cff; box-shadow: 0 0 14px rgba(139,92,255,.3); }
button {
  width: 100%; height: 52px; border: 0; border-radius: 12px;
  font-size: 15px; font-weight: 800; cursor: pointer;
  margin-bottom: 10px; transition: .15s;
  letter-spacing: .3px;
}
button:active { transform: scale(.98); }
.btn-on { background: #ff4b3f; color: #fff; }
.btn-off { background: #39df88; color: #08130d; }
.btn-check { background: #242834; color: #fff; }
.btn-use {
  background: linear-gradient(135deg, #7d43ff, #b45cff);
  color: #fff;
  margin-top: 4px;
}
.status {
  margin-top: 18px; padding: 16px; border-radius: 12px;
  background: #0d0f17; font-size: 13px; color: #b8ffcf;
  word-break: break-word; min-height: 50px;
  display: flex; align-items: center; justify-content: center;
  text-align: center; line-height: 1.5;
}
.status.on { background: #4b1e22; color: #ff6262; font-weight: 700; }
.status.off { background: #1a3a24; color: #39df88; font-weight: 700; }
.status.error { background: #3a1a1a; color: #ff8888; }
.divider {
  height: 1px;
  background: #292c3b;
  margin: 20px 0 18px;
}

/* ========================================== */
/* COLLAPSIBLE SERVICE PANEL */
/* ========================================== */
.collapsible-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: #1b1e2a;
  border: 1px solid #303444;
  border-radius: 14px;
  cursor: pointer;
  transition: .2s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  margin-bottom: 0;
}
.collapsible-header:hover {
  background: #222633;
}
.collapsible-header h2 {
  margin: 0;
  font-size: 15px;
  color: #fff;
  text-align: left;
}
.arrow-toggle {
  font-size: 16px;
  color: #8b5cff;
  transition: transform .3s ease;
  display: inline-block;
  font-weight: 800;
}
.arrow-toggle.open {
  transform: rotate(180deg);
}
.collapsible-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height .4s ease, opacity .3s ease, margin .3s ease;
  opacity: 0;
  margin-top: 0;
}
.collapsible-body.open {
  max-height: 1200px;
  opacity: 1;
  margin-top: 12px;
}
  
/* Service management */
.service-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  background: #1b1e2a;
  border-radius: 12px;
  margin-bottom: 8px;
  gap: 10px;
}
.service-name {
  font-size: 14px;
  font-weight: 700;
  flex: 1;
  text-align: left;
}
.service-name small {
  display: block;
  font-size: 11px;
  color: #8d91a2;
  font-weight: 500;
  margin-top: 2px;
}
.service-btn {
  padding: 8px 14px;
  border: 0;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: .15s;
  width: auto;
  height: auto;
  margin: 0;
}
.service-btn.on { background: #39df88; color: #08130d; }
.service-btn.off { background: #ff4b3f; color: #fff; }
.reason-input {
  width: 100%;
  height: 40px;
  font-size: 12px;
  margin: 0 0 10px 0;
  padding: 0 12px;
  background: #12151f;
  border: 1px solid #303444;
  border-radius: 10px;
  color: #fff;
  outline: none;
}
.reason-input::placeholder { color: #5a5f70; }
</style>
</head>
<body>
<div class="box">
  <h1>🔐 Admin Panel</h1>
  <p class="sub">Masukkan 2 kunci rahasia</p>

  <label>Kunci Pertama</label>
  <input id="key1" type="password" placeholder="Kunci 1" autocomplete="off">

  <label>Kunci Kedua</label>
  <input id="key2" type="password" placeholder="Kunci 2" autocomplete="off">

  <button class="btn-on" onclick="ubah('on')">🔴 AKTIFKAN MAINTENANCE</button>
  <button class="btn-off" onclick="ubah('off')">🟢 MATIKAN MAINTENANCE</button>
  <button class="btn-check" onclick="cek()">🔍 Cek Status Maintenance</button>

  <!-- ========================================== -->
<!-- MANAJEMEN SERVICE — COLLAPSIBLE -->
<!-- ========================================== -->
<div class="collapsible-header" onclick="toggleServicePanel()">
  <h2>⚙️ MANAJEMEN SERVICE</h2>
  <span class="arrow-toggle" id="arrowToggle">▼</span>
</div>

<div class="collapsible-body" id="servicePanel">
  <div id="serviceList">
    <!-- Card service diisi otomatis oleh JavaScript -->
  </div>

  <button class="btn-apply" id="applyBtn" onclick="applyServices()">
    💾 TERAPKAN PERUBAHAN SERVICE
  </button>
</div>

  <button class="btn-use" onclick="bukaAplikasi()">🚀 Pakai Aplikasi (Mode Admin)</button>

  <div class="status" id="status">Siap.</div>
</div>

<script>
const MAINT_API = '/api/maintenance';
const SERVICES_API = '/api/services';
const $ = id => document.getElementById(id);

// ==========================================
// MAINTENANCE
// ==========================================
async function ubah(action) {
  const key1 = $('key1').value.trim();
  const key2 = $('key2').value.trim();
  if (!key1 || !key2) return showStatus('⚠️ Isi kedua kunci dulu!', 'error');

  try {
    const res = await fetch(
      MAINT_API + '?action=' + action +
      '&key1=' + encodeURIComponent(key1) +
      '&key2=' + encodeURIComponent(key2),
      { cache: 'no-store' }
    );
    const data = await res.json();
    if (res.ok && data.success) {
      showStatus('✅ ' + data.message, data.maintenance ? 'on' : 'off');
    } else {
      showStatus('❌ ' + (data.message || data.error || 'Gagal'), 'error');
    }
  } catch (err) {
    showStatus('❌ Error: ' + err.message, 'error');
  }
}

async function cek() {
  try {
    const res = await fetch(MAINT_API, { cache: 'no-store' });
    const data = await res.json();
    showStatus(
      (data.maintenance ? '🔴 MAINTENANCE AKTIF' : '🟢 NORMAL — Aplikasi Jalan'),
      data.maintenance ? 'on' : 'off'
    );
  } catch (err) {
    showStatus('❌ Error: ' + err.message, 'error');
  }
}

// ==========================================
// MANAJEMEN SERVICE
// ==========================================
const SERVICES = [
  { id: 'adlink', name: 'AdLinkSumo' },
  { id: 'sfl', name: 'SFL' },
  { id: 'delta', name: 'Delta' },
  { id: 'linkvertise', name: 'Linkvertise' },
  { id: 'move2link', name: 'Move2link' },
  { id: 'sub2unlock', name: 'Sub2Unlock' },     
  { id: 'sub4unlock', name: 'Sub4Unlock' },     
  { id: 'universal', name: 'Universal' }
];

let servicesData = {};

async function loadServices() {
  try {
    const res = await fetch(SERVICES_API, { cache: 'no-store' });
    const data = await res.json();
    servicesData = data.services || {};
    renderServices();
  } catch (err) {
    console.error('Load services failed:', err);
  }
}

function renderServices() {
  const container = $('serviceList');
  container.innerHTML = '';

  SERVICES.forEach(svc => {
    const info = servicesData[svc.id] || { status: 'on', reason: '' };
    const isOn = info.status === 'on';

    const item = document.createElement('div');
    item.className = 'service-item';
    item.innerHTML = `
      <div class="service-name">
        ${svc.name}
        <small>${isOn ? 'Aktif' : 'Nonaktif: ' + (info.reason || 'tanpa alasan')}</small>
      </div>
      <button class="service-btn ${isOn ? 'on' : 'off'}"
              onclick="toggleService('${svc.id}')">
        ${isOn ? '🟢 ON' : '🔴 OFF'}
      </button>
    `;
    container.appendChild(item);

    if (!isOn) {
      const reasonInput = document.createElement('input');
      reasonInput.type = 'text';
      reasonInput.className = 'reason-input';
      reasonInput.placeholder = 'Alasan OFF (tampil ke user)';
      reasonInput.value = info.reason || '';
      reasonInput.onchange = () => updateReason(svc.id, reasonInput.value);
      container.appendChild(reasonInput);
    }
  });
}

async function toggleService(serviceId) {
  const key1 = $('key1').value.trim();
  const key2 = $('key2').value.trim();
  if (!key1 || !key2) return showStatus('⚠️ Isi kedua kunci dulu!', 'error');

  const current = servicesData[serviceId] || { status: 'on' };
  const newStatus = current.status === 'on' ? 'off' : 'on';
  const reason = current.reason || '';

  try {
    const res = await fetch(
      SERVICES_API + '?action=set&service=' + serviceId +
      '&status=' + newStatus +
      '&reason=' + encodeURIComponent(reason) +
      '&key1=' + encodeURIComponent(key1) +
      '&key2=' + encodeURIComponent(key2),
      { cache: 'no-store' }
    );
    const data = await res.json();
    if (res.ok && data.success) {
      showStatus('✅ ' + data.message, newStatus === 'on' ? 'off' : 'on');
      await loadServices();
    } else {
      showStatus('❌ ' + (data.error || 'Gagal'), 'error');
    }
  } catch (err) {
    showStatus('❌ Error: ' + err.message, 'error');
  }
}

async function updateReason(serviceId, reason) {
  const key1 = $('key1').value.trim();
  const key2 = $('key2').value.trim();
  const current = servicesData[serviceId] || { status: 'off' };

  try {
    await fetch(
      SERVICES_API + '?action=set&service=' + serviceId +
      '&status=' + current.status +
      '&reason=' + encodeURIComponent(reason) +
      '&key1=' + encodeURIComponent(key1) +
      '&key2=' + encodeURIComponent(key2),
      { cache: 'no-store' }
    );
    await loadServices();
    showStatus('✅ Alasan disimpan', 'off');
  } catch (err) {}
}

// ==========================================
// TOGGLE SERVICE PANEL
// ==========================================
function toggleServicePanel() {
  const panel = document.getElementById('servicePanel');
  const arrow = document.getElementById('arrowToggle');

  panel.classList.toggle('open');
  arrow.classList.toggle('open');
}
  
// ==========================================
// BUKA APLIKASI (MODE ADMIN)
// ==========================================
function bukaAplikasi() {
  const key1 = $('key1').value.trim();
  const key2 = $('key2').value.trim();
  if (!key1 || !key2) return showStatus('⚠️ Isi kedua kunci dulu!', 'error');

  const url = '/?admin=' + encodeURIComponent(key1) + '&key2=' + encodeURIComponent(key2);
  window.open(url, '_blank');
  showStatus('✅ Aplikasi dibuka di tab baru (mode admin)', 'off');
}

function showStatus(text, cls) {
  const el = $('status');
  el.textContent = text;
  el.className = 'status ' + (cls || '');
}

// Init
cek();
loadServices();
</script>
</body>
</html>
